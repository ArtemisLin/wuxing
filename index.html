<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五行喜忌卡</title>
<style>
/* 画风跟「拉拉鉴定所」一套，取自「谷雨 × HERSTORY」易拉宝：粉色双线窗口、奶油底、像素字、四角星、浅色网格 */
@font-face { font-family: 'Pixel'; src: url('ui/pixel.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Smiley'; src: url('ui/smiley.woff2') format('woff2'); font-display: swap; }
:root {
  --bg: #fdf5f8;
  --grid: #f5dde7;
  --line: #e98fb0;
  --rose: #e2007a;
  --rose-soft: #ffc6dc;
  --bar: #fcd9e5;
  --cream: #fff3df;
  --cream2: #fffaf2;
  --pink: #fbd6e2;
  --purple: #4b3fd6;
  --ink: #211d36;
  --soft: #5b5670;
  --mute: #a59fb5;
  /* 五行色，跟课件一致 */
  --木: #1e8e47; --火: #c93a28; --土: #8a5416; --金: #ae8400; --水: #1f6dbf;
  --sans: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --pixel: 'Pixel', var(--sans);
  --smiley: 'Smiley', var(--sans);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
body {
  min-height: 100vh; padding: 26px 16px 40px;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
}
.hidden { display: none !important; }
.deco { position: fixed; pointer-events: none; z-index: 0; }

/* ---------- 窗口 ---------- */
.win { position: relative; z-index: 1; background: var(--cream); border: 2.5px solid var(--line); border-radius: 16px; box-shadow: 0 0 0 4px var(--cream2), 0 0 0 6px var(--line), 0 14px 34px rgba(226, 0, 122, .10); }
.win > .bar { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 14px; background: var(--bar); border-bottom: 2.5px solid var(--line); border-radius: 13px 13px 0 0; font-family: var(--pixel); font-size: 18px; color: var(--rose); }
.win > .bar .btns { display: flex; gap: 6px; }
.win > .bar .btns i { width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 4px; background: var(--cream2); }
.win > .body { padding: 24px 24px 22px; }
.label { font-family: var(--pixel); font-size: 16px; color: var(--rose); letter-spacing: 1px; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
.label::before { content: '✦'; font-size: 14px; }
.warn { color: var(--rose); font-weight: 700; }

/* ---------- 首页 ---------- */
.home { max-width: 480px; margin: 0 auto; }
.hero { position: relative; text-align: center; margin: -6px 0 4px; }
.hero img.pc { width: 250px; max-width: 70%; filter: drop-shadow(0 6px 14px rgba(226, 0, 122, .15)); }
.title { font-family: var(--smiley); font-size: 46px; line-height: 1.1; color: var(--rose); text-align: center; text-shadow: 3px 3px 0 var(--rose-soft); letter-spacing: 2px; }
.sub { text-align: center; color: var(--soft); font-size: 16px; margin-top: 8px; }
.how { color: var(--soft); font-size: 15px; line-height: 1.6; }
.name { width: 100%; height: 48px; border-radius: 10px; border: 2px solid var(--line); background: var(--cream2); font-size: 18px; padding: 0 14px; color: var(--ink); font-family: var(--sans); }
.name:focus { outline: 3px solid var(--rose-soft); }
select.name { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--line) 50%), linear-gradient(135deg, var(--line) 50%, transparent 50%); background-position: calc(100% - 22px) 21px, calc(100% - 15px) 21px; background-size: 7px 7px; background-repeat: no-repeat; }
.adv { display: grid; gap: 10px; }
.adv div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 21px; line-height: 1.5; color: var(--ink); }
.adv b { font-family: var(--pixel); font-weight: 400; font-size: 18px; color: #fff; background: var(--purple); border-radius: 10px; text-align: center; padding: 3px 0; margin-top: 2px; }
.c-mbti { margin: 12px auto 0; display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border-radius: 22px; background: var(--purple); color: #fff; font-size: 20px; }
.c-mbti b { font-family: var(--smiley); font-weight: 400; font-size: 30px; letter-spacing: 2px; }
.c-mbti small { font-family: var(--pixel); font-size: 16px; opacity: .85; }
.c-mbti2 { font-size: 19px; color: var(--purple); margin-top: 8px; }
.c-home { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--pink); font-size: 19px; line-height: 1.5; color: var(--ink); }
.c-cnote { margin-top: 10px; font-size: 16px; line-height: 1.5; color: var(--soft); }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; text-align: center; margin-top: 10px; }
.picks .pos { font-family: var(--pixel); font-size: 15px; color: var(--soft); margin-bottom: 5px; }
.slot { display: block; width: 100%; height: 56px; border-radius: 10px; border: 2px solid var(--line); background: var(--cream2); font-family: var(--smiley); font-size: 32px; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.slot.ph { font-family: var(--pixel); font-size: 16px; color: var(--mute); }
.slot + .slot { margin-top: 8px; }
.slot.on { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); background: #fff; }
.kb { margin-top: 14px; border: 2px dashed var(--line); border-radius: 12px; padding: 10px 10px 12px; background: var(--cream2); }
.kb .t { font-family: var(--pixel); font-size: 15px; color: var(--rose); margin-bottom: 9px; }
.keys { display: grid; gap: 8px; }
.keys.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.keys.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.key { height: 58px; border-radius: 10px; border: 2px solid currentColor; background: #fff; font-family: var(--smiley); font-size: 28px; line-height: 1; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; -webkit-tap-highlight-color: transparent; }
.key small { font-family: var(--pixel); font-size: 11px; opacity: .85; }
.key:active { transform: translateY(1px); }
.key.unk { grid-column: 1 / -1; height: 44px; font-family: var(--pixel); font-size: 16px; color: var(--soft); }
.key.cur { outline: 3px solid var(--rose); outline-offset: 2px; }
.kb-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
.kb-foot:empty { display: none; }
.kb-foot button { font-family: var(--pixel); font-size: 15px; padding: 6px 13px; border-radius: 15px; border: 2px solid var(--line); background: #fff; color: var(--rose); cursor: pointer; }
.kb-foot button.clr { color: var(--soft); }
.acts { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.btn { font-family: var(--pixel); font-size: 19px; padding: 11px 28px; border-radius: 26px; border: 2.5px solid var(--rose); cursor: pointer; background: var(--rose); color: #fff; letter-spacing: 1px; text-decoration: none; box-shadow: 0 4px 0 #b30062; }
.btn.big { width: 100%; font-size: 21px; padding: 13px 0; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b30062; }
.btn.ghost { background: var(--cream2); color: var(--rose); box-shadow: 0 4px 0 var(--line); border-color: var(--line); }
.err, .hint { text-align: center; font-size: 15px; min-height: 22px; margin-top: 10px; }
.err { color: var(--rose); }
.hint { color: var(--soft); }

/* ---------- 结果页 ---------- */
.result { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.stage { width: 100%; min-width: 0; overflow: hidden; padding: 6px 0 4px; }
.scene { margin: 0 auto; position: relative; opacity: 0; transform: translateY(14px); transition: opacity .7s, transform .7s; }
.scene.on { opacity: 1; transform: none; }
.scene .card { position: absolute; top: 0; left: 0; }

/* ---------- 卡（宽 720，至少高 1180，字多就自动变高；按栏宽缩放） ---------- */
.card { width: 720px; min-height: 1180px; display: flex; flex-direction: column; padding: 100px 50px 36px; transform-origin: top left; background: var(--cream); border-radius: 30px; overflow: hidden; box-shadow: 0 18px 50px rgba(226, 0, 122, .16); }
.card .frame { position: absolute; inset: 14px; border: 3px solid var(--line); border-radius: 20px; pointer-events: none; }
.card .frame::after { content: ''; position: absolute; inset: 6px; border: 1.5px solid var(--line); border-radius: 14px; }
.card .tb { position: absolute; top: 34px; left: 38px; right: 38px; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--bar); border: 2.5px solid var(--line); border-radius: 12px; font-family: var(--pixel); font-size: 21px; color: var(--rose); }
.card .tb .btns { display: flex; gap: 7px; }
.card .tb .btns i { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 4px; background: var(--cream2); }
.card .st1 { position: absolute; top: 92px; right: 40px; width: 56px; z-index: 2; }
.card .st2 { position: absolute; top: 236px; left: 34px; width: 36px; z-index: 2; }
.card .in { position: relative; flex: 1; display: flex; flex-direction: column; }

.c-head { text-align: center; padding-top: 14px; }
.c-name { font-family: var(--sans); font-weight: 700; font-size: 30px; color: var(--soft); letter-spacing: 1px; } /* 名字是学员自己填的，字不一定在裁过的字体里，用系统字 */
.c-label { font-family: var(--smiley); font-size: 62px; line-height: 1.15; color: var(--rose); text-shadow: 3px 3px 0 var(--rose-soft); letter-spacing: 2px; margin-top: 4px; }
.c-phrase { font-size: 23px; line-height: 1.5; color: var(--ink); margin: 8px 20px 0; }
.c-sub { font-family: var(--pixel); font-size: 19px; color: var(--soft); margin-top: 6px; letter-spacing: 1px; }
.c-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 20px; color: var(--ink); }
.c-items span b { font-family: var(--pixel); font-weight: 400; color: var(--rose); font-size: 18px; margin-right: 4px; }
.c-items i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; border: 2px solid rgba(33, 29, 54, .12); }
.c-dir2 { font-family: var(--smiley); font-size: 26px; color: var(--ink); margin-top: 16px; }
.c-dir2 b { color: var(--purple); font-weight: 400; }
.c-dir2 small { font-family: var(--sans); font-size: 16px; color: var(--soft); margin-left: 6px; }
.tags span.yang { background: #ece9ff; border-color: #b9b2f3; }
.feel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.feel button { height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--cream2); font-family: var(--pixel); font-size: 17px; color: var(--soft); cursor: pointer; }
.feel button.on { background: var(--rose); border-color: var(--rose); color: #fff; }
.c-phrase::before { content: '「'; color: var(--line); }
.c-phrase::after { content: '」'; color: var(--line); }

.blk { margin-top: 20px; padding-top: 16px; border-top: 2px dashed var(--pink); }
.blk h4 { font-family: var(--pixel); font-size: 18px; color: var(--rose); font-weight: 400; margin-bottom: 10px; letter-spacing: 1px; }
.blk h4::before { content: '✦ '; }

.c-strength { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 18px; align-items: center; }
.c-level { font-family: var(--smiley); font-size: 76px; line-height: 1; text-align: center; color: var(--ink); text-shadow: 3px 3px 0 var(--pink); }
.c-level small { display: block; font-family: var(--pixel); font-size: 17px; color: var(--soft); text-shadow: none; margin-top: 8px; letter-spacing: 1px; }
.meter { position: relative; height: 30px; border: 2.5px solid var(--line); border-radius: 15px; background: var(--cream2); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; background: var(--rose); border-radius: 12px 0 0 12px; }
.meter u { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 0; border-left: 3px dashed var(--ink); opacity: .55; }
.meter-t { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 17px; color: var(--soft); margin-top: 6px; }
.meter-t b { color: var(--rose); font-weight: 400; }
.meter-t .mid { color: var(--ink); }
.chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { font-family: var(--pixel); font-size: 17px; padding: 4px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--cream2); color: var(--mute); }
.chip.on { background: var(--rose); border-color: var(--rose); color: #fff; }

.xj-row { display: flex; align-items: center; gap: 14px; }
.xj-row + .xj-row { margin-top: 12px; }
.xj-tag { flex: none; width: 46px; height: 46px; border-radius: 12px; color: #fff; font-family: var(--pixel); font-size: 24px; display: flex; align-items: center; justify-content: center; }
.xj-tag.xi { background: var(--purple); }
.xj-tag.ji { background: var(--mute); }
.wx { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--smiley); font-size: 46px; color: #fff; box-shadow: 0 0 0 4px var(--cream2), 0 0 0 6px var(--line); }
.wx.s { width: 58px; height: 58px; font-size: 32px; box-shadow: none; background: var(--cream2) !important; border: 3px solid; }
.wx-arrow { color: var(--line); font-size: 26px; }
.c-note { font-size: 19px; line-height: 1.5; color: var(--soft); margin-top: 12px; }
.c-note b { color: var(--rose); }

.c-two { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; }
.sw { display: flex; gap: 14px; }
.sw div { text-align: center; width: 92px; }
.sw i { display: block; width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%; border: 3px solid rgba(33, 29, 54, .12); box-shadow: 0 0 0 4px var(--cream2); }
.sw span { font-size: 18px; color: var(--ink); white-space: nowrap; }
.nums { font-family: var(--smiley); font-size: 64px; color: var(--rose); letter-spacing: 6px; line-height: 1.1; text-shadow: 3px 3px 0 var(--rose-soft); }
.taste { font-size: 19px; color: var(--soft); margin-top: 8px; line-height: 1.45; }

.c-dir { font-family: var(--smiley); font-size: 30px; color: var(--ink); }
.c-dir b { color: var(--rose); font-weight: 400; }
.tags { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
.tags span { font-size: 21px; padding: 5px 15px; border-radius: 18px; background: var(--cream2); border: 2px solid var(--line); }
.tags span.abroad { background: var(--pink); border-color: var(--pink); }

.c-foot { margin-top: auto; padding-top: 14px; border-top: 2px dashed var(--pink); display: flex; align-items: flex-end; justify-content: space-between; }
.c-foot .l { font-size: 17px; color: var(--soft); line-height: 1.6; }
.c-foot .l b { font-family: var(--pixel); font-weight: 400; color: var(--rose); font-size: 19px; letter-spacing: 1px; }
.seal { flex: none; width: 104px; height: 104px; border: 3px solid var(--rose); border-radius: 50%; color: var(--rose); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-12deg); background: rgba(255, 250, 242, .92); font-weight: 700; line-height: 1.15; position: relative; margin-bottom: -4px; }
.seal::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--rose); border-radius: 50%; }
.seal b { font-size: 21px; letter-spacing: 2px; }
.seal i { font-style: normal; font-size: 13px; letter-spacing: 1px; margin-top: 3px; }


/* ---------- 五行生克图（首页主图、卡上的喜忌都用它） ---------- */
.wheel { position: relative; width: 600px; height: 590px; transform-origin: top left; }
.wheel svg { position: absolute; inset: 0; overflow: visible; }
.wheel .nd { position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%; background: var(--cream2); border: 3px solid var(--line); box-shadow: 0 0 0 5px var(--cream2), 0 0 0 7px var(--pink); display: flex; align-items: center; justify-content: center; }
.wheel .nd img { width: 104px; height: 104px; object-fit: contain; }
.wheel .nd .ch { font-family: var(--smiley); font-size: 58px; }
.wheel .lb { position: absolute; transform: translate(-50%, -50%); font-family: var(--smiley); font-size: 38px; line-height: 1; text-shadow: 2px 2px 0 var(--cream2); }
.wheel .bd { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--cream2); border: 2.5px solid; display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: 19px; }
.wheel .bd.k { border-color: var(--soft); color: var(--soft); }
.wheel .nd.xi { border-color: var(--rose); box-shadow: 0 0 0 5px var(--cream2), 0 0 0 9px var(--rose), 0 0 26px 8px rgba(226, 0, 122, .25); }
.wheel .nd.ji { filter: grayscale(1); opacity: .38; }
.wheel .rk { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--rose); color: #fff; font-family: var(--smiley); font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--cream2); }
.wheel .rk.j { background: var(--mute); font-family: var(--pixel); font-size: 19px; }
.hero-wheel { margin: 6px auto 4px; }
.xj-legend { font-size: 21px; color: var(--ink); text-align: center; margin-top: 4px; }
.xj-legend b { font-family: var(--pixel); font-weight: 400; color: var(--rose); margin: 0 6px 0 14px; }
.xj-legend b.j { color: var(--soft); }

/* ---------- 怎么算的 ---------- */
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.pillars .col { border: 2px solid var(--line); border-radius: 12px; background: var(--cream2); padding: 6px 0 8px; }
.pillars .col.day { background: var(--pink); }
.pillars .pos { font-family: var(--pixel); font-size: 13px; color: var(--soft); }
.pillars .gz { font-family: var(--smiley); font-size: 30px; line-height: 1.15; }
table.sc { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.sc th { font-family: var(--pixel); font-weight: 400; color: var(--rose); font-size: 14px; text-align: left; padding: 4px 3px; border-bottom: 2px solid var(--line); }
table.sc td { padding: 6px 3px; border-bottom: 1.5px dashed var(--pink); vertical-align: top; line-height: 1.45; }
table.sc td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.sc td.p { white-space: nowrap; color: var(--soft); }
table.sc td.p b { font-family: var(--smiley); font-size: 20px; color: var(--ink); font-weight: 400; }
table.sc .h { color: var(--purple); }
table.sc tr.tot td { font-weight: 700; border-bottom: none; }
.sum5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; margin-top: 10px; }
.sum5 div { border: 2px solid var(--line); border-radius: 10px; background: var(--cream2); padding: 5px 0; font-size: 13px; color: var(--soft); }
.sum5 div.h { background: #ece9ff; border-color: #b9b2f3; }
.sum5 b { display: block; font-size: 17px; color: var(--ink); }
.why { list-style: none; font-size: 15px; line-height: 1.6; }
.why li { padding: 5px 0 5px 22px; position: relative; border-bottom: 1.5px dashed var(--pink); }
.why li::before { content: '✦'; position: absolute; left: 2px; color: var(--rose); }
.why li b { color: var(--rose); }
.rule { font-size: 14.5px; color: var(--soft); line-height: 1.65; background: var(--cream2); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 14px; }

/* ---------- 任务栏 ---------- */
.taskbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 50px; padding-bottom: env(safe-area-inset-bottom); display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--cream); border-top: 2.5px solid var(--line); font-family: var(--pixel); font-size: 16px; }
.taskbar .start { padding: 5px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--pink); color: var(--ink); white-space: nowrap; }
.taskbar .tab { padding: 5px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--cream2); color: var(--rose); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.taskbar .clock { margin-left: auto; padding: 5px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--cream2); color: var(--ink); }

.shot { position: fixed; inset: 0; background: rgba(33, 29, 54, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; z-index: 9; }
.shot img { max-width: 100%; max-height: 80vh; border-radius: 14px; }
.shot p { color: #fff; font-size: 17px; }

@media (max-width: 600px) {
  body { padding: 16px 12px 30px; }
  .win > .body { padding: 18px 14px 18px; }
  .title { font-size: 42px; }
  .taskbar { gap: 8px; padding: 0 10px; font-size: 15px; }
  .taskbar .tab.extra { display: none; }
}
</style>
</head>
<body>

<img class="deco" src="ui/star-y.png" alt="" style="left:2%;top:120px;width:46px">

<script src="html2canvas.min.js"></script>
<script src="wuxing.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const q = new URLSearchParams(location.search);
const b = (q.get('b') || '').trim();
const nameQ = (q.get('n') || '').trim().slice(0, 8);
const WXC = w => 'var(--' + w + ')';
const f2 = x => (Math.round(x * 100) / 100).toString();




/* ---------- 五行生克图 ---------- */
// 按 600×590 设计：水在上，顺时针木、火、土、金（跟课件的生克图一样）；外圈箭头是生，中间虚线是克
const WHEEL_ORDER = ['水', '木', '火', '土', '金'];
const WHEEL_ICON = { 木: 'ui/wx-mu.webp', 火: 'ui/wx-huo.webp', 土: 'ui/wx-tu.webp', 金: 'ui/wx-jin.webp', 水: 'ui/wx-shui.webp' };
const WX_COLOR = { 木: '#1e8e47', 火: '#c93a28', 土: '#8a5416', 金: '#ae8400', 水: '#1f6dbf' };
let wheelIconsOK = false;
function wheelHTML(opt) {
  opt = opt || {};
  const C = [300, 300], R = 200, r = 64;
  const ang = i => (-90 + i * 72) * Math.PI / 180;
  const P = i => [C[0] + R * Math.cos(ang(i)), C[1] + R * Math.sin(ang(i))];
  const f = n => n.toFixed(1);
  const head = (x, y, dx, dy, col) => {   // 箭头：尖在 (x,y)，方向 (dx,dy)
    const L = Math.hypot(dx, dy); dx /= L; dy /= L;
    const s = 16, w = 8;
    return '<polygon points="' + f(x) + ',' + f(y) + ' ' + f(x - dx * s - dy * w) + ',' + f(y - dy * s + dx * w) + ' ' + f(x - dx * s + dy * w) + ',' + f(y - dy * s - dx * w) + '" fill="' + col + '"/>';
  };
  let svg = '', html = '';
  // 生：外圈弧线
  for (let i = 0; i < 5; i++) {
    const d = (r + 16) / R, a1 = ang(i) + d, a2 = ang(i + 1) - d, col = WX_COLOR[WHEEL_ORDER[i]];
    const x1 = C[0] + R * Math.cos(a1), y1 = C[1] + R * Math.sin(a1), x2 = C[0] + R * Math.cos(a2), y2 = C[1] + R * Math.sin(a2);
    svg += '<path d="M' + f(x1) + ' ' + f(y1) + ' A' + R + ' ' + R + ' 0 0 1 ' + f(x2) + ' ' + f(y2) + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" opacity=".8"/>';
    svg += head(x2, y2, -Math.sin(a2), Math.cos(a2), col);
    const am = (ang(i) + ang(i + 1)) / 2;
    html += '<div class="bd" style="left:' + f(C[0] + R * Math.cos(am)) + 'px;top:' + f(C[1] + R * Math.sin(am)) + 'px;border-color:' + col + ';color:' + col + '">生</div>';
  }
  // 克：中间虚线
  for (let i = 0; i < 5; i++) {
    const [ax, ay] = P(i), [bx, by] = P(i + 2);
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, g = r + 10;
    const x1 = ax + ux * g, y1 = ay + uy * g, x2 = bx - ux * g, y2 = by - uy * g;
    svg += '<line x1="' + f(x1) + '" y1="' + f(y1) + '" x2="' + f(x2) + '" y2="' + f(y2) + '" stroke="#5b5670" stroke-width="2.6" stroke-dasharray="9 7" opacity=".6"/>';
    svg += head(x2, y2, ux, uy, 'rgba(91,86,112,.7)');
    html += '<div class="bd k" style="left:' + f(ax + dx * 0.5) + 'px;top:' + f(ay + dy * 0.5) + 'px">克</div>';
  }
  // 五个圆圈、旁边的字、喜忌标记
  WHEEL_ORDER.forEach((w, i) => {
    const [x, y] = P(i), xiAt = (opt.xi || []).indexOf(w), isJi = (opt.ji || []).includes(w);
    html += '<div class="nd' + (xiAt >= 0 ? ' xi' : '') + (isJi ? ' ji' : '') + '" style="left:' + f(x) + 'px;top:' + f(y) + 'px">' +
      (wheelIconsOK ? '<img src="' + WHEEL_ICON[w] + '" alt="' + w + '">' : '<span class="ch" style="color:' + WX_COLOR[w] + '">' + w + '</span>') + '</div>';
    const lx = x + (r + 34) * Math.cos(ang(i)), ly = y + (r + 34) * Math.sin(ang(i));
    if (wheelIconsOK) html += '<div class="lb" style="left:' + f(lx) + 'px;top:' + f(ly) + 'px;color:' + WX_COLOR[w] + (isJi ? ';opacity:.45' : '') + '">' + w + '</div>';
    if (xiAt >= 0) html += '<div class="rk" style="left:' + f(x + r * 0.78) + 'px;top:' + f(y - r * 0.78) + 'px">' + (xiAt + 1) + '</div>';
    if (isJi) html += '<div class="rk j" style="left:' + f(x + r * 0.78) + 'px;top:' + f(y - r * 0.78) + 'px">忌</div>';
  });
  return '<div class="wheel"><svg viewBox="0 0 600 590" width="600" height="590">' + svg + '</svg>' + html + '</div>';
}
// 图案都在才用图案，否则圆圈里先写字
function loadWheelIcons(done) {
  let n = 0, ok = 0;
  Object.values(WHEEL_ICON).forEach(src => { const im = new Image(); im.onload = () => { ok++; if (++n === 5) { wheelIconsOK = ok === 5; done(); } }; im.onerror = () => { if (++n === 5) { wheelIconsOK = ok === 5; done(); } }; im.src = src; });
}
// 首页主图：按栏宽缩放
function fitHeroWheel() {
  const box = $('heroWheel'); if (!box || !box.firstChild) return;
  const k = Math.min(1, (box.parentElement.clientWidth - 10) / 600);
  box.firstChild.style.transform = 'scale(' + k + ')';
  box.style.width = 600 * k + 'px'; box.style.height = 590 * k + 'px';
}

/* ---------- 首页 ---------- */
// 字按五行上色：天干看本身，地支看本气
// 用函数声明（会提前生效），因为页面一打开就调用 showHome / showResult
function isGan(c) { return Wuxing.GAN.includes(c); }
function wxOf(c) { return isGan(c) ? Wuxing.GAN_WX[c] : Wuxing.GAN_WX[Wuxing.CG[c][0]]; }
function yyOf(c) { return (isGan(c) ? Wuxing.GAN.indexOf(c) : Wuxing.ZHI.indexOf(c)) % 2 === 0 ? '阳' : '阴'; }
function colorOf(c) { return { 木: '#1e8e47', 火: '#c93a28', 土: '#8a5416', 金: '#ae8400', 水: '#1f6dbf' }[wxOf(c)]; }
function paint(c) { return '<span style="color:' + colorOf(c) + '">' + c + '</span>'; }

function showHome() {
  $('home').classList.remove('hidden');
  const drawHero = () => { $('heroWheel').innerHTML = wheelHTML(); fitHeroWheel(); };
  drawHero(); loadWheelIcons(drawHero); window.addEventListener('resize', fitHeroWheel);
  const cols = ['年柱', '月柱', '日柱', '时柱'];
  const g = ['', '', '', ''], z = ['', '', '', ''];
  let act = { t: 'g', i: 0 };
  const order = [0, 1, 2, 3].flatMap(i => [{ t: 'g', i }, { t: 'z', i }]);
  const val = s => (s.t === 'g' ? g : z)[s.i];
  const nextEmpty = () => order.find(s => !val(s)) || null;

  function render() {
    $('picks').innerHTML = cols.map((c, i) => '<div><div class="pos">' + c + '</div>' + ['g', 'z'].map(t => {
      const v = (t === 'g' ? g : z)[i], on = act && act.t === t && act.i === i;
      const txt = v === '?' ? '？' : v || (t === 'g' ? '天干' : '地支');
      return '<button type="button" class="slot' + (v ? '' : ' ph') + (on ? ' on' : '') + '" data-t="' + t + '" data-i="' + i + '"' +
        (v && v !== '?' ? ' style="color:' + colorOf(v) + '"' : '') + '>' + txt + '</button>';
    }).join('') + '</div>').join('');
    $('picks').querySelectorAll('.slot').forEach(b => { b.onclick = () => { act = { t: b.dataset.t, i: +b.dataset.i }; render(); }; });
    $('kb').classList.remove('hidden');
    const filled = order.some(s => val(s));
    const foot = [];
    if (filled && (!act || order.findIndex(s => s.t === act.t && s.i === act.i) > 0)) foot.push('<button type="button" data-a="back">⌫ 退一格</button>');
    if (act && act.t === 'z' && g[act.i] && g[act.i] !== '?') foot.push('<button type="button" data-a="gan">改天干</button>');
    if (filled) foot.push('<button type="button" class="clr" data-a="clear">清空重选</button>');
    $('kbFoot').innerHTML = foot.join('');
    $('kbFoot').querySelectorAll('button').forEach(b => { b.onclick = () => tool(b.dataset.a); });
    if (!act) {
      $('kbT').textContent = '八个字都选好了。要改哪个字，点上面那一格。';
      $('keys').className = 'keys'; $('keys').innerHTML = '';
      return;
    }
    const { t, i } = act;
    const known = g[i] && g[i] !== '?';
    const keys = t === 'g' ? [...Wuxing.GAN] : [...Wuxing.ZHI].filter((x, k) => !known || k % 2 === Wuxing.GAN.indexOf(g[i]) % 2);
    $('kbT').textContent = '选' + cols[i] + (t === 'g' ? '的天干' : '的地支') + (t === 'z' && known ? '（' + g[i] + '是' + yyOf(g[i]) + '干，只配' + yyOf(g[i]) + '支）' : '');
    $('keys').className = 'keys ' + (keys.length === 10 ? 'k5' : 'k6');
    const cur = (t === 'g' ? g : z)[i];
    $('keys').innerHTML = keys.map(x => '<button type="button" class="key' + (x === cur ? ' cur' : '') + '" data-v="' + x + '" style="color:' + colorOf(x) + '">' + x + '<small>' + yyOf(x) + wxOf(x) + '</small></button>').join('') +
      (i === 3 ? '<button type="button" class="key unk" data-v="?">不知道时辰</button>' : '');
    $('keys').querySelectorAll('.key').forEach(b => { b.onclick = () => pick(b.dataset.v); });
  }

  // 退一格、改天干、清空重选
  function tool(a) {
    $('err').textContent = '';
    if (a === 'clear') { g.fill(''); z.fill(''); act = order[0]; }
    else if (a === 'gan') { act = { t: 'g', i: act.i }; }
    else if (a === 'back') {
      const k = act ? order.findIndex(s => s.t === act.t && s.i === act.i) : order.length;
      let j = k - 1;
      while (j > 0 && !val(order[j])) j--;          // 跳过还空着的格子，退到上一个选过的字
      const p = order[j];
      if (val(p) === '?') { g[3] = ''; z[3] = ''; act = { t: 'g', i: 3 }; }
      else { (p.t === 'g' ? g : z)[p.i] = ''; act = p; }
    }
    render();
  }

  function pick(v) {
    const { t, i } = act;
    $('err').textContent = '';
    if (v === '?') { g[3] = '?'; z[3] = '?'; act = nextEmpty(); render(); return; }
    if (t === 'g') {
      g[i] = v;
      if (z[i] === '?' || (z[i] && Wuxing.ZHI.indexOf(z[i]) % 2 !== Wuxing.GAN.indexOf(v) % 2)) z[i] = '';   // 阴阳对不上就清掉地支
      act = !z[i] ? { t: 'z', i } : nextEmpty();
    } else {
      if (g[i] === '?') g[i] = '';
      z[i] = v;
      act = nextEmpty();
    }
    render();
  }
  render();
  $('homeProv').innerHTML += Wuxing.PROV_LIST.map(p => '<option>' + p + '</option>').join('');
  $('mbti').innerHTML += Object.keys(Wuxing.MBTI_NAME).sort().map(t => '<option value="' + t + '">' + t + ' ' + Wuxing.MBTI_NAME[t] + '</option>').join('');
  $('homeProv').onchange = () => {
    const list = Wuxing.HOME_CITY[$('homeProv').value] || [];
    $('homeCity').classList.toggle('hidden', list.length < 2);
    $('homeCity').innerHTML = '<option value="">出生的城市</option>' + list.map(c => '<option>' + c[0] + '</option>').join('') + '<option value="其他">其他城市</option>';
    $('err').textContent = '';
  };
  let feel = '';
  $('feel').querySelectorAll('button').forEach(b => { b.onclick = () => { feel = b.dataset.f; $('feel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; });

  $('go').onclick = () => {
    let s = '';
    for (let i = 0; i < 4; i++) {
      if (i === 3 && (g[3] === '?' || z[3] === '?')) break;
      if (!g[i] || !z[i]) { $('err').textContent = '「' + cols[i] + '」还没选完'; act = { t: !g[i] ? 'g' : 'z', i }; render(); return; }
      s += g[i] + z[i];
    }
    if (!Wuxing.parse(s)) { $('err').textContent = '有一柱的天干地支配不上（阳干配阳支、阴干配阴支），再对一下排盘'; return; }
    const n = $('nm').value.trim();
    const h = $('homeProv').value, needCity = (Wuxing.HOME_CITY[h] || []).length > 1, c = needCity ? $('homeCity').value : '';
    if (!h) { $('err').textContent = '请选老家的省份'; $('homeProv').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('homeProv').focus(); return; }
    if (needCity && !c) { $('err').textContent = '请选老家的城市'; $('homeCity').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('homeCity').focus(); return; }
    const m = $('mbti').value;
    location.search = '?b=' + encodeURIComponent(s) + (n ? '&n=' + encodeURIComponent(n) : '') + (feel ? '&t=' + feel : '') + (h ? '&h=' + encodeURIComponent(h) : '') + (c ? '&c=' + encodeURIComponent(c) : '') + (m ? '&m=' + m : '');
  };
}

/* ---------- 结果页 ---------- */
function wxBall(w, small) { return '<span class="wx' + (small ? ' s' : '') + '" style="' + (small ? 'color:' + WXC(w) + ';border-color:' + WXC(w) : 'background:' + WXC(w)) + '">' + w + '</span>'; }

function showResult() {
  const r = Wuxing.judge(b, { feel: q.get('t') || '', home: q.get('h') || '', city: q.get('c') || '' });
  if (r.error) { showHome(); $('err').textContent = '链接里的八字看不懂，请在上面重新选一次'; return; }
  $('result').classList.remove('hidden');
  if (q.has('only')) { $('how').classList.add('hidden'); $('acts').classList.add('hidden'); document.body.style.padding = '10px'; }
  document.title = (nameQ ? nameQ + '的' : '') + '五行喜忌卡';

  // 卡
  $('cName').textContent = (nameQ || '我') + '的五行喜忌';
  $('cLabel').textContent = r.nick;
  $('cSub').textContent = r.label + ' · ' + r.level;
  $('cPhrase').textContent = r.nickLine;
  $('cMbti').innerHTML = '<small>八字 MBTI</small><b>' + r.mbti.type + '</b>' + esc(r.mbti.name);
  const realM = (q.get('m') || '').toUpperCase();
  if (Wuxing.MBTI_NAME[realM]) {
    const diff = [0, 1, 2, 3].filter(i => realM[i] !== r.mbti.type[i]).map(i => Wuxing.MBTI_DIFF[r.mbti.type[i] + realM[i]]);
    $('cMbti2').textContent = diff.length ? '你测出来是 ' + realM + '：' + diff.join('；') + '。' : '你测出来也是 ' + realM + '，八字和 MBTI 对上了，实锤。';
  } else $('cMbti2').classList.add('hidden');
  $('cLevel').innerHTML = esc(r.level) + '<small>' + (r.deling ? '得令' : '失令') + ' · ' + r.ling + '当令</small>';
  $('cLevel').style.fontSize = r.level.length > 2 ? '56px' : '';
  const ix = Math.round(r.index);
  $('cMeter').style.width = Math.max(4, ix) + '%';
  $('cIdx').textContent = ix;
  const solidRoot = r.roots.some(x => !x.broken);
  $('cChips').innerHTML = [['得令', r.deling], ['得地', solidRoot], ['得生', r.sheng.length > 0], ['得助', r.zhu.length > 0 || r.roots.some(x => !x.broken && x.k === 0)]]
    .map(([n, on]) => '<span class="chip' + (on ? ' on' : '') + '">' + n + (on ? ' ✓' : ' ✗') + '</span>').join('');
  const drawWheel = () => { $('cWheel').innerHTML = wheelHTML({ xi: r.xiWx, ji: r.jiWx }); fit(); };
  drawWheel(); loadWheelIcons(drawWheel);
  $('cLegend').innerHTML = '<b>喜</b>' + r.xiWx.map(w => '<span style="color:' + WX_COLOR[w] + '">' + w + '</span>').join(' › ') + '<b class="j">忌</b>' + r.jiWx.map(w => '<span style="color:' + WX_COLOR[w] + '">' + w + '</span>').join('、');
  const notes = [];
  if (r.cong) notes.push('<b>这个盘可能是' + r.cong + '格</b>，喜忌按' + r.cong + '取，和一般的盘相反；拿不准可以请懂行的老师再看看。');
  $('cNote').innerHTML = notes.join('<br>');
  $('cAdv').innerHTML = '<div><b>社交</b><span>' + esc(r.social) + '</span></div><div><b>工作</b><span>' + esc(r.work) + '</span></div>';
  $('cColors').innerHTML = r.colors.map(([n, h]) => '<div><i style="background:' + h + '"></i><span>' + n + '</span></div>').join('');
  $('cNums').textContent = r.nums.join(' ');
  $('cTaste').textContent = '喜好口味：' + r.tastes.join('、') + (r.veg ? '；多吃蔬菜，少吃肉' : '');
  $('cItems').innerHTML = '<span><b>口红</b>' + esc(r.lip) + '</span><span><b>发色</b>' + esc(r.hair) + '</span><span><b>头像底色</b><i style="background:' + r.avatar[1] + '"></i>' + esc(r.avatar[0]) + '</span>';
  $('cDir').innerHTML = '你的方向在<b>' + esc(r.dirText) + '</b>';
  $('cDir2').innerHTML = '养你的地方在<b>' + esc(r.yangDir) + '</b>';
  $('cYang').innerHTML = r.yangCities.map(c => '<span class="yang">' + esc(c) + '</span>').join('');
  if (r.homeLine) $('cHome').textContent = r.homeLine; else $('cHome').classList.add('hidden');
  $('cCities').innerHTML = r.cities.map(c => '<span>' + esc(c) + '</span>').join('') + r.countries.map(c => '<span class="abroad">' + esc(c) + '</span>').join('');
  $('cBazi').innerHTML = '八字  ' + r.pillars.map(p => paint(p[0]) + paint(p[1])).join('  ') + (r.has4 ? '' : '（没有时柱）');


  fit();
  window.addEventListener('resize', fit);
  requestAnimationFrame(() => setTimeout(() => $('scene').classList.add('on'), 60));

  $('save').onclick = async () => {
    $('saveHint').textContent = '正在生成图片……';
    try {
      await document.fonts.ready;
      const cv = await html2canvas($('card'), { scale: 2, backgroundColor: null, useCORS: true, onclone: d => { d.getElementById('card').style.transform = 'none'; } });
      const url = cv.toDataURL('image/png');
      if (matchMedia('(pointer: coarse)').matches) {
        const box = document.createElement('div');
        box.className = 'shot';
        box.innerHTML = '<img alt="五行喜忌卡"><p>长按图片保存，点空白处关闭</p>';
        box.querySelector('img').src = url;
        box.onclick = e => { if (e.target === box) box.remove(); };
        document.body.appendChild(box);
        $('saveHint').textContent = '';
      } else {
        const a = document.createElement('a');
        a.download = '五行喜忌卡' + (nameQ ? '-' + nameQ : '') + '.png';
        a.href = url;
        a.click();
        $('saveHint').textContent = '已保存，发到群里看看大家都喜什么';
      }
    } catch (e) {
      $('saveHint').textContent = '保存没成功，直接截图也行';
    }
  };
}

// 卡按 720×1180 设计：按栏宽缩放
function fit() {
  const w = Math.min(720, $('stage').clientWidth || 720);
  const k = w / 720;
  $('card').style.transform = 'scale(' + k + ')';
  $('scene').style.width = 720 * k + 'px';
  $('scene').style.height = $('card').offsetHeight * k + 'px';
}
// 启动放在最后：上面所有的常量、函数都定义好了再跑
if (!b) showHome(); else showResult();
</script>
</body>
</html>
